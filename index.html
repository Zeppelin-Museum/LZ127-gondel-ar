<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR-Welttest – verbessert</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script
src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
async
crossorigin="anonymous"
data-preload-chunks="slam">
</script>

<style>
html, body {
margin: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #171717;
color: white;
font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

#camera {
position: fixed !important;
inset: 0 !important;
width: 100vw !important;
height: 100dvh !important;
display: block;
margin: 0;
padding: 0;
border: 0;
background: #222;
z-index: 0;
}

body {
position: fixed;
inset: 0;
width: 100vw;
height: 100dvh;
}


#panel {
position: fixed;
z-index: 2;
left: 0;
right: 0;
bottom: 0;
padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
text-align: center;
background: rgba(0, 0, 0, 0.78);
box-sizing: border-box;
}

h1 { font-size: 1.2rem; margin: 0 0 8px; }
p { line-height: 1.4; margin: 0 0 12px; }
#tracking { font-size: 0.9rem; opacity: 0.95; }
button {
padding: 13px 18px;
border: 0;
border-radius: 10px;
font-size: 1rem;
font-weight: 700;
}
</style>
</head>

<body>
<canvas id="camera"></canvas>

<main id="panel">
<h1>AR-Welttest</h1>
<p id="status">Lade 3D- und AR-Engine …</p>
<p id="tracking">World Tracking: noch nicht gestartet</p>
<button id="start" disabled>AR-Test starten</button>
</main>

<script>
const statusText = document.getElementById('status');
const trackingText = document.getElementById('tracking');
const startButton = document.getElementById('start');
const panel = document.getElementById('panel');
const canvas = document.getElementById('camera');

let started = false;

function readyCheck() {
if (!window.THREE) {
statusText.textContent = 'Three.js konnte nicht geladen werden. Prüfe die Internetverbindung.';
return;
}
if (!window.XR8) {
statusText.textContent = 'AR-Engine lädt noch …';
return;
}
statusText.textContent = 'Bereit. Richte das iPhone auf eine gut beleuchtete Umgebung.';
startButton.disabled = false;
}

window.addEventListener('xrloaded', readyCheck);
const waitForEngine = setInterval(() => {
if (window.XR8 && window.THREE) {
clearInterval(waitForEngine);
readyCheck();
}
}, 100);

function makeScene(scene) {
const group = new THREE.Group();

const box = new THREE.Mesh(
new THREE.BoxGeometry(0.22, 0.22, 0.22),
new THREE.MeshStandardMaterial({
color: 0xffcc33,
roughness: 0.5,
metalness: 0.02
})
);
group.add(box);

// The torus is rotated flat so it forms a horizontal ring below the cube.
const ring = new THREE.Mesh(
new THREE.TorusGeometry(0.19, 0.018, 12, 48),
new THREE.MeshStandardMaterial({
color: 0x33ddff,
roughness: 0.4,
metalness: 0.05
})
);
ring.rotation.x = Math.PI / 2;
ring.position.y = -0.17;
group.add(ring);

const stem = new THREE.Mesh(
new THREE.CylinderGeometry(0.012, 0.012, 0.07, 12),
new THREE.MeshStandardMaterial({color: 0xffffff})
);
stem.position.y = -0.14;
group.add(stem);

// Place the object 1.5 m in front of the initial camera pose.
group.position.set(0, 0, -1.5);
scene.add(group);

scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 1.8));
const light = new THREE.DirectionalLight(0xffffff, 1.4);
light.position.set(1, 2, 1);
scene.add(light);
}

startButton.addEventListener('click', () => {
if (started || !window.XR8 || !window.THREE) return;
started = true;
startButton.disabled = true;
statusText.textContent = 'Starte Kamera und World Tracking …';
trackingText.textContent = 'Tracking initialisiert …';

try {
// Explicitly keep SLAM / world tracking enabled.
XR8.XrController.configure({
disableWorldTracking: false,
scale: 'responsive'
});

XR8.addCameraPipelineModules([
XR8.GlTextureRenderer.pipelineModule(),
XR8.Threejs.pipelineModule(),
XR8.XrController.pipelineModule(),
{
name: 'ar-world-test-scene',
listeners: [
{
event: 'reality.trackingstatus',
process: ({detail}) => {
const status = detail && detail.status ? detail.status : 'unbekannt';
const reason = detail && detail.reason ? detail.reason : '';
trackingText.textContent =
'World Tracking: ' + status +
(reason ? ' (' + reason + ')' : '');
}
}
],
onStart: () => {
const {scene, camera} = XR8.Threejs.xrScene();

// Set the initial tracking origin to the current camera pose.
XR8.XrController.updateCameraProjectionMatrix({
origin: camera.position,
facing: camera.quaternion
});

makeScene(scene);
statusText.textContent = 'Gelber Würfel mit waagerechtem blauem Ring.';
startButton.style.display = 'none';
}
}
]);

XR8.run({
canvas: canvas,
cameraConfig: {
direction: XR8.XrConfig.camera().BACK
},
allowedDevices: XR8.XrConfig.device().MOBILE
});
} catch (error) {
statusText.textContent =
'Start fehlgeschlagen: ' +
(error && error.message ? error.message : String(error));
startButton.disabled = false;
started = false;
}
});
</script>
</body>
</html>
