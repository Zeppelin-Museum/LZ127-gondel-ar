<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR-Welttest</title>

<!-- Three.js für das 3D-Testobjekt -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<!-- 8th Wall Engine inklusive World-Tracking-Modul -->
<script
src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
async
crossorigin="anonymous"
data-preload-chunks="slam">
</script>

<style>
html, body {
margin: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #171717;
color: white;
font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

#camera {
position: fixed;
inset: 0;
width: 100%;
height: 100%;
display: block;
background: #222;
}

#panel {
position: fixed;
z-index: 2;
left: 0;
right: 0;
bottom: 0;
padding: 20px 16px calc(22px + env(safe-area-inset-bottom));
text-align: center;
background: rgba(0, 0, 0, 0.76);
box-sizing: border-box;
}

h1 { font-size: 1.25rem; margin: 0 0 8px; }
p { line-height: 1.4; margin: 0 0 14px; }
button {
padding: 14px 20px;
border: 0;
border-radius: 10px;
font-size: 1rem;
font-weight: 700;
}
</style>
</head>

<body>
<canvas id="camera"></canvas>

<main id="panel">
<h1>AR-Welttest</h1>
<p id="status">Lade 3D- und AR-Engine …</p>
<button id="start" disabled>AR-Test starten</button>
</main>

<script>
const statusText = document.getElementById('status');
const startButton = document.getElementById('start');
const panel = document.getElementById('panel');
const canvas = document.getElementById('camera');

let started = false;

function readyCheck() {
if (!window.THREE) {
statusText.textContent = 'Three.js konnte nicht geladen werden. Bitte Internetverbindung prüfen.';
return;
}

if (!window.XR8) {
statusText.textContent = 'AR-Engine lädt noch …';
return;
}

statusText.textContent = 'Bereit. Tippe auf „AR-Test starten“.';
startButton.disabled = false;
}

window.addEventListener('xrloaded', readyCheck);

const waitForEngine = setInterval(() => {
if (window.XR8 && window.THREE) {
clearInterval(waitForEngine);
readyCheck();
}
}, 100);

function makeScene({scene, camera}) {
// Helle, gut sichtbare Testfigur direkt vor dem Startpunkt.
const group = new THREE.Group();

const box = new THREE.Mesh(
new THREE.BoxGeometry(0.22, 0.22, 0.22),
new THREE.MeshStandardMaterial({
color: 0xffcc33,
roughness: 0.45,
metalness: 0.05
})
);
group.add(box);

const ring = new THREE.Mesh(
new THREE.TorusGeometry(0.19, 0.025, 12, 48),
new THREE.MeshStandardMaterial({
color: 0x33ddff,
roughness: 0.35,
metalness: 0.1
})
);
ring.position.y = -0.23;
group.add(ring);

const stem = new THREE.Mesh(
new THREE.CylinderGeometry(0.012, 0.012, 0.2, 12),
new THREE.MeshStandardMaterial({color: 0xffffff})
);
stem.position.y = -0.12;
group.add(stem);

// Three.js camera faces down the negative Z axis by default.
// The object is placed 1.5 metres in front of the initial viewpoint.
group.position.set(0, 0, -1.5);
scene.add(group);

const ambient = new THREE.HemisphereLight(0xffffff, 0x667788, 1.8);
scene.add(ambient);

const light = new THREE.DirectionalLight(0xffffff, 1.5);
light.position.set(1, 2, 1);
scene.add(light);

// Keep the world origin aligned to the initial camera pose.
XR8.XrController.updateCameraProjectionMatrix({
origin: camera.position,
facing: camera.quaternion
});
}

startButton.addEventListener('click', () => {
if (started || !window.XR8 || !window.THREE) return;

started = true;
startButton.disabled = true;
statusText.textContent = 'Starte Kamera und World Tracking …';

try {
XR8.addCameraPipelineModules([
XR8.GlTextureRenderer.pipelineModule(),
XR8.Threejs.pipelineModule(),
XR8.XrController.pipelineModule(),
{
name: 'ar-world-test-scene',
onStart: ({canvasWidth, canvasHeight}) => {
const {scene, camera} = XR8.Threejs.xrScene();
makeScene({scene, camera});

panel.innerHTML =
'<h1>AR-Test läuft</h1>' +
'<p>Du solltest einen gelben Würfel mit einem blauen Ring sehen. Bewege dich langsam seitlich und gehe ein Stück darum herum.</p>';
},
onException: (error) => {
const message = error && error.message
? error.message
: 'Unbekannter Fehler';
panel.innerHTML =
'<h1>AR-Fehler</h1><p>' + message + '</p>' +
'<p>Bitte lade die Seite neu und versuche es erneut.</p>';
}
}
]);

XR8.run({
canvas: canvas,
cameraConfig: {
direction: XR8.XrConfig.camera().BACK
},
allowedDevices: XR8.XrConfig.device().MOBILE
});
} catch (error) {
statusText.textContent =
'Start fehlgeschlagen: ' +
(error && error.message ? error.message : String(error));
startButton.disabled = false;
started = false;
}
});
</script>
</body>
</html>
