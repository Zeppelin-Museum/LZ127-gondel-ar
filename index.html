<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8th Wall Safari-Diagnose</title>

<script
src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
async
crossorigin="anonymous"
data-preload-chunks="slam">
</script>

<style>
html, body {
margin: 0;
min-height: 100%;
background: #171717;
color: white;
font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

#camera {
position: fixed;
inset: 0;
width: 100%;
height: 100%;
background: #222;
}

#panel {
position: relative;
z-index: 2;
margin: 16px;
padding: 18px;
border-radius: 12px;
background: rgba(0, 0, 0, 0.88);
overflow-wrap: anywhere;
}

h1 { font-size: 1.25rem; margin-top: 0; }
p { line-height: 1.4; }
button {
padding: 13px 18px;
border: 0;
border-radius: 9px;
font-size: 1rem;
font-weight: 600;
}
#details { white-space: pre-wrap; font-size: 0.9rem; line-height: 1.45; }
</style>
</head>

<body>
<canvas id="camera"></canvas>

<main id="panel">
<h1>Safari-Kameradiagnose</h1>
<p id="status">Prüfe Browser und lade die Engine …</p>
<button id="start" disabled>Kamera starten</button>
<p id="details">Die Diagnose wird hier angezeigt.</p>
</main>

<script>
const statusText = document.getElementById('status');
const details = document.getElementById('details');
const startButton = document.getElementById('start');
const canvas = document.getElementById('camera');

let engineReady = false;
let started = false;

function writeDetails(extra) {
const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
const lines = [
'Browser: ' + navigator.userAgent,
'HTTPS / sicherer Kontext: ' + window.isSecureContext,
'Kamera-API verfügbar: ' + Boolean(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
'WebGL verfügbar: ' + Boolean(gl),
'XR8-Engine verfügbar: ' + Boolean(window.XR8)
];
if (extra) lines.push('', 'Meldung: ' + extra);
details.textContent = lines.join('\n');
}

function engineLoaded() {
if (!window.XR8) {
statusText.textContent = 'Die Engine wurde nicht geladen.';
writeDetails('Kein window.XR8 nach dem Ladeereignis.');
return;
}
engineReady = true;
startButton.disabled = false;
statusText.textContent = 'Engine geladen. Tippe auf „Kamera starten“.';
writeDetails();
}

window.addEventListener('xrloaded', engineLoaded);

window.addEventListener('error', (event) => {
writeDetails(event.message || 'JavaScript-Fehler');
statusText.textContent = 'Ein JavaScript- oder Ladefehler ist aufgetreten.';
});

window.addEventListener('unhandledrejection', (event) => {
const message = event.reason && event.reason.message
? event.reason.message
: String(event.reason || 'Unbekannter Fehler');
writeDetails(message);
statusText.textContent = 'Ein Startvorgang ist fehlgeschlagen.';
});

// Show browser capability checks immediately.
writeDetails();

// Give the asynchronous engine script time to load.
let waitCount = 0;
const waitForEngine = setInterval(() => {
waitCount++;
if (window.XR8) {
clearInterval(waitForEngine);
engineLoaded();
} else if (waitCount >= 150) {
clearInterval(waitForEngine);
statusText.textContent = 'Die Engine lädt nicht. Prüfe Verbindung oder Browser.';
writeDetails('Nach 15 Sekunden ist window.XR8 noch nicht verfügbar.');
}
}, 100);

startButton.addEventListener('click', () => {
if (!engineReady || started) return;
started = true;
startButton.disabled = true;
statusText.textContent = 'Kamera wird angefordert …';

try {
XR8.addCameraPipelineModules([
XR8.GlTextureRenderer.pipelineModule(),
XR8.XrController.pipelineModule(),
{
name: 'safari-diagnostic',
onCameraStatusChange: ({ status }) => {
statusText.textContent = 'Kamerastatus: ' + status;
writeDetails('Kamerastatus: ' + status);

if (status === 'hasVideo') {
statusText.textContent = 'Kamera läuft.';
}

if (status === 'failed') {
startButton.disabled = false;
started = false;
statusText.textContent =
'Kamera fehlgeschlagen. Lies die Diagnose unten.';
}
},
onException: (error) => {
const message = error && error.message
? error.message
: JSON.stringify(error);
statusText.textContent = '8th-Wall-Fehler.';
writeDetails(message || 'Unbekannte Engine-Ausnahme');
startButton.disabled = false;
started = false;
}
}
]);

XR8.run({
canvas: canvas,
cameraConfig: {
direction: XR8.XrConfig.camera().BACK
},
allowedDevices: XR8.XrConfig.device().MOBILE
});
} catch (error) {
const message = error && error.message
? error.message
: String(error);
statusText.textContent = 'Start fehlgeschlagen.';
writeDetails(message);
startButton.disabled = false;
started = false;
}
});
</script>
</body>
</html>
