<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR-Kameratest</title>

<!--

License: https://github.com/8thwall/engine/blob/main/LICENSE
-->

<script
src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
async
crossorigin="anonymous"
data-preload-chunks="slam">
</script>

<style>
html, body {
margin: 0;
width: 100%;
height: 100%;
overflow: hidden;
font-family: sans-serif;
background: #171717;
color: white;
}

#camera {
position: fixed;
inset: 0;
width: 100%;
height: 100%;
display: block;
background: #222;
}

#panel {
position: fixed;
z-index: 2;
inset: auto 0 0 0;
padding: 24px 18px calc(24px + env(safe-area-inset-bottom));
text-align: center;
background: rgba(0, 0, 0, 0.72);
}

h1 {
font-size: 1.35rem;
margin: 0 0 10px;
}

p {
line-height: 1.45;
margin: 0 0 16px;
}

button {
font-size: 1rem;
padding: 14px 22px;
border: 0;
border-radius: 10px;
font-weight: bold;
}
</style>
</head>

<body>
<canvas id="camera"></canvas>

<main id="panel">
<h1>AR-Kameratest</h1>
<p id="status">Tippe auf „Kamera starten“, um den Test zu beginnen.</p>
<button id="start">Kamera starten</button>
</main>

<script>
const startButton = document.getElementById('start');
const statusText = document.getElementById('status');
const panel = document.getElementById('panel');
const canvas = document.getElementById('camera');

startButton.addEventListener('click', async () => {
startButton.disabled = true;
statusText.textContent = 'Engine wird geladen …';

try {
// Wait briefly for the async engine script to finish loading.
let attempts = 0;
while (!window.XR8 && attempts < 100) {
await new Promise(resolve => setTimeout(resolve, 100));
attempts++;
}

if (!window.XR8) {
throw new Error('Die AR-Engine konnte nicht geladen werden. Bitte Internetverbindung prüfen und Seite neu laden.');
}

statusText.textContent = 'Kamera wird gestartet …';

window.XR8.run({
canvas: canvas,
cameraConfig: {
direction: window.XR8.XrConfig.camera().BACK
}
});

panel.innerHTML =
'<h1>Kamera-Anfrage läuft</h1>' +
'<p>Falls Safari fragt, erlaube den Kamerazugriff. Das Kamerabild sollte dann erscheinen.</p>';
} catch (error) {
statusText.textContent =
error && error.message
? error.message
: 'Start fehlgeschlagen. Bitte Seite neu laden und erneut versuchen.';
startButton.disabled = false;
}
});
</script>
</body>
</html>
