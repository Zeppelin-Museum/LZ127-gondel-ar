<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR-Kameratest</title>

<!--
This product includes the XR Engine software developed by Niantic Spatial, Inc.

<script
src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
async
crossorigin="anonymous"
data-preload-chunks="slam">
</script>

<style>
html, body {
margin: 0;
width: 100%;
height: 100%;
overflow: hidden;
font-family: sans-serif;
background: #171717;
color: white;
}

#camera {
position: fixed;
inset: 0;
width: 100%;
height: 100%;
display: block;
background: #222;
}

#panel {
position: fixed;
z-index: 2;
left: 0;
right: 0;
bottom: 0;
padding: 24px 18px calc(24px + env(safe-area-inset-bottom));
text-align: center;
background: rgba(0, 0, 0, 0.72);
box-sizing: border-box;
}

h1 {
font-size: 1.35rem;
margin: 0 0 10px;
}

p {
line-height: 1.45;
margin: 0 0 16px;
}

button {
font-size: 1rem;
padding: 14px 22px;
border: 0;
border-radius: 10px;
font-weight: bold;
}
</style>
</head>

<body>
<canvas id="camera"></canvas>

<main id="panel">
<h1>AR-Kameratest</h1>
<p id="status">Lade AR-Engine …</p>
<button id="start" disabled>Kamera starten</button>
</main>

<script>
const startButton = document.getElementById('start');
const statusText = document.getElementById('status');
const panel = document.getElementById('panel');
const canvas = document.getElementById('camera');

let engineReady = false;
let started = false;

function engineLoaded() {
if (!window.XR8) {
statusText.textContent =
'Die AR-Engine wurde nicht geladen. Prüfe die Internetverbindung und lade die Seite neu.';
return;
}

engineReady = true;
startButton.disabled = false;
statusText.textContent =
'Engine bereit. Tippe auf „Kamera starten“.';
}

window.addEventListener('xrloaded', engineLoaded);

// In case the engine finished loading before this listener was registered.
if (window.XR8) {
engineLoaded();
}

startButton.addEventListener('click', () => {
if (!engineReady || started) return;

started = true;
startButton.disabled = true;
statusText.textContent =
'Kamera wird gestartet. Bitte Kamerazugriff erlauben …';

try {
XR8.addCameraPipelineModules([
// Draws the camera image on the canvas.
XR8.GlTextureRenderer.pipelineModule(),

// Enables the tracking system needed for later AR placement.
XR8.XrController.pipelineModule(),

// Shows camera startup and failure status.
{
name: 'ar-camera-test-status',
onCameraStatusChange: ({ status }) => {
if (status === 'requesting') {
statusText.textContent =
'Warte auf Kamerafreigabe …';
} else if (status === 'hasStream') {
statusText.textContent =
'Kamerastream erhalten …';
} else if (status === 'hasVideo') {
panel.innerHTML =
'<h1>Kamera funktioniert!</h1>' +
'<p>Der Kameratest ist erfolgreich. Als Nächstes ergänzen wir das AR-Modell.</p>';
} else if (status === 'failed') {
statusText.textContent =
'Kamerastart fehlgeschlagen. Prüfe die Safari-Kameraberechtigung und lade die Seite neu.';
startButton.disabled = false;
started = false;
}
}
}
]);

XR8.run({
canvas: canvas,
cameraConfig: {
direction: XR8.XrConfig.camera().BACK
},
allowedDevices: XR8.XrConfig.device().MOBILE
});
} catch (error) {
statusText.textContent =
'Fehler beim Start: ' +
(error && error.message ? error.message : 'Unbekannter Fehler');
startButton.disabled = false;
started = false;
}
});
</script>
</body>
</html>
